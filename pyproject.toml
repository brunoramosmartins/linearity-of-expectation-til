[project]
name = "linearity-of-expectation-til"
version = "0.1.0"
description = "Portfolio-grade TIL on linearity of expectation: proof, variance counterpoint, indicator-variable applications, and a budget-modelling simulation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Bruno Ramos Martins" },
]
keywords = ["probability", "expectation", "variance", "monte-carlo", "til"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ──────────────────────────────────────────────
# Ruff — lint + format
# Author runs manually: `ruff check .` / `ruff format .`
# ──────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv",
    "notebooks",
    "figures",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is handled by formatter
    "N803",  # uppercase argument names allowed for math symbols (X, Y, K, ...)
    "N806",  # uppercase local variables allowed for math (Sigma, X, ...)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts allowed in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ──────────────────────────────────────────────
# Pytest
# Author runs manually: `pytest tests/`
# ──────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
